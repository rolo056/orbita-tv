name: Compilar APK

on:
  push:
    branches: [main]
    # Nada de esto entra en el APK. Sin este filtro, cambiar un color en
    # tema.json publicaria una version nueva y el televisor ofreceria
    # actualizar a algo identico a lo que ya tiene instalado.
    paths-ignore:
      - 'tema.json'
      - 'docs/**'
      - 'tools/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner de Ubuntu ya trae el SDK de Android instalado y con las
      # licencias aceptadas. Usarlo directo evita la accion setup-android, que
      # es exactamente donde fallaban las dos primeras corridas.
      - name: Preparar el SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK en $SDK"
          ls "$SDK/platforms" || true
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$MGR" ]; then
            yes | "$MGR" --licenses >/dev/null 2>&1 || true
            "$MGR" --install "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Temporal, mientras el build no pase: los logs de Actions piden permisos
      # de administrador, asi que el error se publica como issue del repo, que
      # si se puede leer desde afuera. Se quita en cuanto compile en verde.
      - name: Publicar el error donde se pueda leer
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Corrida ${{ github.run_id }} · commit ${{ github.sha }}"
            echo
            echo '### Errores de compilacion'
            echo '```'
            grep -E "^(e:|w:|error:|FAILURE:|Caused by:)" build.log | head -60 || echo "sin lineas de error reconocibles"
            echo '```'
            echo '### Final del log'
            echo '```'
            tail -100 build.log
            echo '```'
          } > error.md
          gh issue create --repo "${{ github.repository }}" \
            --title "Build fallo: corrida ${{ github.run_id }}" \
            --body-file error.md

      - name: Renombrar el APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/*.apk salida/orbita-tv.apk

      # Lo que la app consulta al abrir para saber si hay algo nuevo. El numero
      # de compilacion es el numero de version, asi que comparar enteros alcanza.
      - name: Escribir version.json
        run: |
          cat > salida/version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apk": "https://github.com/${{ github.repository }}/releases/download/ultima/orbita-tv.apk",
            "notas": "commit ${{ github.sha }}"
          }
          JSON
          cat salida/version.json

      - uses: actions/upload-artifact@v4
        with:
          name: orbita-tv-apk
          path: salida/orbita-tv.apk

      # Publica siempre en la misma etiqueta, asi la URL de descarga para el
      # televisor no cambia nunca.
      - name: Publicar como ultima version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: ALEX TV - ultima compilacion
          prerelease: true
          files: |
            salida/orbita-tv.apk
            salida/version.json

      # Ademas de "ultima", cada compilacion queda publicada con su propio
      # numero. Sin esto, una version mala sobrescribe a la buena y no hay forma
      # comoda de volver atras desde un televisor.
      - name: Publicar tambien con numero de version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ALEX TV 1.0.${{ github.run_number }}
          prerelease: true
          files: |
            salida/orbita-tv.apk
            salida/version.json
