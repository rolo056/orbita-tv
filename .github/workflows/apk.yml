name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar componentes del SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Firmado con la clave de depuracion que genera AGP: el APK se instala a
      # mano en el televisor, no pasa por Play Store.
      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar el APK
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/release/*.apk salida/orbita-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: orbita-tv-apk
          path: salida/orbita-tv.apk

      # Publica siempre en la misma etiqueta, asi la URL de descarga para el
      # televisor no cambia nunca.
      - name: Publicar como ultima version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Órbita TV — última compilación
          prerelease: true
          files: salida/orbita-tv.apk
